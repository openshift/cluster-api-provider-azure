# Post-processes the manifests generated by manifests-gen. The ocp-manifests
# target in openshift/Makefile applies this kustomization to
# ../capi-operator-manifests/default/manifests.yaml with tools/kustomize-build.
# That tool only loads the regular files directly in this directory and that
# manifests file, and fails if the result adds, removes, renames or reorders
# resources: only patch existing resources here. Remote (http or git)
# references are not blocked by kustomize and must not be used.
#
# manifests-gen sets the resource requests of every Deployment container to
# cpu 10m / memory 50Mi and removes its limits after it builds
# openshift/kustomization.yaml, so patches there cannot change resource
# requests. Provider-specific values are applied here, after generation.
#
# Do not edit capi-operator-manifests/ by hand; run `make ocp-manifests`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../capi-operator-manifests/default/manifests.yaml

patches:
# No-op merge that makes the build fail if the Deployment is renamed or
# removed. A patch selected only by target would silently match nothing.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: capz-controller-manager
      namespace: openshift-cluster-api

# Memory request of the manager container. Only the memory request is
# replaced: the cpu request and the absence of limits still come from
# manifests-gen.
# The test operations make the build fail if the first container is not
# "manager", or if the manifests-gen default memory request is no longer
# 50Mi. In that case, re-evaluate whether this override is still needed
# instead of silently overriding the new default.
- target:
    group: apps
    version: v1
    kind: Deployment
    name: capz-controller-manager
    namespace: openshift-cluster-api
  patch: |-
    - op: test
      path: /spec/template/spec/containers/0/name
      value: manager
    - op: test
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 50Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 160Mi
